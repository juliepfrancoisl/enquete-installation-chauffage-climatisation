<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquête logement & foyer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #dde1e7;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --error: #dc2626;
    --success: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.95rem; }
  form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  .field { margin-bottom: 20px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
  .hint { color: var(--muted); font-size: 0.8rem; margin-top: 4px; }
  input[type="number"],
  input[type="text"],
  select,
  textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  textarea { resize: vertical; min-height: 80px; }
  .row { display: flex; gap: 16px; }
  .row .field { flex: 1; }
  .consent {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }
  .consent input { margin-top: 3px; }
  .consent label { font-weight: 400; margin: 0; font-size: 0.85rem; line-height: 1.4; }
  button {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .msg {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }
  .msg.success { display: block; background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
  .msg.error { display: block; background: #fef2f2; color: var(--error); border: 1px solid #fecaca; }
  .msg.info { display: block; background: #eff6ff; color: var(--accent); border: 1px solid #bfdbfe; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Enquête logement & foyer</h1>
    <p class="subtitle">Vos réponses sont confidentielles et utilisées uniquement dans le cadre de cette étude.</p>

    <form id="formEnquete">
      <div class="row">
        <div class="field">
          <label for="nb_personnes">Nombre de personnes dans le foyer</label>
          <input type="number" id="nb_personnes" min="1" required>
        </div>
        <div class="field">
          <label for="nb_enfants">Dont enfants</label>
          <input type="number" id="nb_enfants" min="0" value="0" required>
        </div>
      </div>

      <div class="field">
        <label for="type_logement">Type de logement</label>
        <select id="type_logement" required>
          <option value="">— Sélectionner —</option>
          <option value="appartement">Appartement</option>
          <option value="maison">Maison</option>
          <option value="autre">Autre</option>
        </select>
      </div>

      <div class="field">
        <label for="code_postal">Code postal</label>
        <input type="text" id="code_postal" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" placeholder="75001" required>
      </div>

      <div class="field">
        <label for="tranche_revenu">Tranche de revenu mensuel du foyer</label>
        <select id="tranche_revenu" required>
          <option value="">— Sélectionner —</option>
          <option value="< 1200 €">Moins de 1 200 €</option>
          <option value="1200-2000 €">1 200 – 2 000 €</option>
          <option value="2000-3000 €">2 000 – 3 000 €</option>
          <option value="3000-4500 €">3 000 – 4 500 €</option>
          <option value="> 4500 €">Plus de 4 500 €</option>
          <option value="Ne souhaite pas répondre">Ne souhaite pas répondre</option>
        </select>
      </div>

      <div class="field">
        <label for="commentaire">Commentaire (facultatif)</label>
        <textarea id="commentaire" placeholder="Vous pouvez préciser votre situation ici..."></textarea>
      </div>

      <div class="field">
        <div class="consent">
          <input type="checkbox" id="consentement" required>
          <label for="consentement">
            J'accepte que mes réponses soient collectées et stockées de façon sécurisée
            dans le cadre de cette enquête, conformément au RGPD. Ces données ne seront
            ni revendues ni partagées avec des tiers.
          </label>
        </div>
      </div>

      <button type="submit" id="submitBtn">Envoyer mes réponses</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

<script>
  const form = document.getElementById("formEnquete");
  const submitBtn = document.getElementById("submitBtn");
  const msg = document.getElementById("msg");

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = "msg " + type;
  }

  let supabaseClient = null;
  try {
    if (window.supabase && !SUPABASE_URL.includes("VOTRE-PROJET")) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch (e) {
    console.warn("Supabase non configuré, mode démo local activé.", e);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    showMsg("Envoi en cours...", "info");

    const payload = {
      nb_personnes: parseInt(document.getElementById("nb_personnes").value, 10),
      nb_enfants: parseInt(document.getElementById("nb_enfants").value, 10),
      type_logement: document.getElementById("type_logement").value,
      code_postal: document.getElementById("code_postal").value.trim(),
      tranche_revenu: document.getElementById("tranche_revenu").value,
      commentaire: document.getElementById("commentaire").value.trim() || null,
      consentement_rgpd: document.getElementById("consentement").checked,
    };

    try {
      if (supabaseClient) {
        const { error } = await supabaseClient.from("reponses_menages").insert([payload], { returning: "minimal" });
        if (error) throw error;
        showMsg("Merci, vos réponses ont bien été enregistrées.", "success");
      } else {
        // Repli local (démo hors ligne / Supabase non configuré)
        const existing = JSON.parse(localStorage.getItem("reponses_menages_demo") || "[]");
        existing.push({ id: crypto.randomUUID(), created_at: new Date().toISOString(), ...payload });
        localStorage.setItem("reponses_menages_demo", JSON.stringify(existing));
        showMsg("Mode démo (Supabase non configuré) : réponse enregistrée localement.", "info");
      }
      form.reset();
      document.getElementById("nb_enfants").value = 0;
    } catch (err) {
      console.error(err);
      showMsg("Une erreur est survenue lors de l'envoi. Merci de réessayer.", "error");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
